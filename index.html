<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImpactSoft Company Brochure</title>
  <style>
    body {
      margin: 0;
      background: #1e1e24;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .book-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
    }
    #flipbook {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .page {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Blinking welcome message positioned in the empty left half of the cover spread */
    #coverWelcome {
      position: absolute;
      left: 0;
      top: 0;
      width: 50%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
    }
    #coverWelcome span {
      font-size: clamp(22px, 2.6vw, 38px);
      font-weight: 800;
      line-height: 1.35;
      color: #60a5fa;
      text-shadow: 0 0 18px rgba(96, 165, 250, 0.65);
      animation: blinkPulse 1.3s ease-in-out infinite;
    }
    @keyframes blinkPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.98); }
    }

    /* Hide the left-side message on narrow mobile screens where single-page portrait mode is active */
    @media (max-width: 767px) {
      #coverWelcome {
        display: none !important;
      }
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #2563eb; }
    #status { font-size: 14px; color: #cbd5e1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>

  <div id="status">Loading brochure...</div>

  <div class="book-wrapper">
    <div id="coverWelcome">
      <span>Welcome to ImpactSoft company brochure, click the right side page to flip the brochure 👉</span>
    </div>
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">← Previous</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn">Next →</button>
  </div>

  <script>
    const pdfUrl = 'brochure.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function initFlipbook() {
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      const container = document.getElementById('flipbook');
      const welcomeOverlay = document.getElementById('coverWelcome');
      let pageWidth = 450;
      let pageHeight = 600;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.8 });

        if (i === 1) {
          const ratio = viewport.height / viewport.width;
          pageWidth = Math.min(480, window.innerWidth * 0.42);
          pageHeight = Math.round(pageWidth * ratio);
        }

        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        pageDiv.appendChild(canvas);
        container.appendChild(pageDiv);
      }

      document.getElementById('status').style.display = 'none';

      const pageFlip = new St.PageFlip(container, {
        width: pageWidth,
        height: pageHeight,
        size: 'stretch',
        minWidth: 300,
        maxWidth: 600,
        minHeight: 400,
        maxHeight: 850,
        showCover: true,
        usePortrait: window.innerWidth < 768
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      const updateUI = () => {
        const currentIndex = pageFlip.getCurrentPageIndex();
        document.getElementById('pageInfo').textContent =
          `Page ${currentIndex + 1} of ${pdf.numPages}`;

        // Show blinking welcome text only when viewing the front cover (index 0) on desktop
        if (currentIndex === 0 && window.innerWidth >= 768) {
          welcomeOverlay.style.display = 'flex';
        } else {
          welcomeOverlay.style.display = 'none';
        }
      };

      updateUI();
      pageFlip.on('flip', updateUI);
      window.addEventListener('resize', updateUI);

      document.getElementById('prevBtn').onclick = () => pageFlip.flipPrev();
      document.getElementById('nextBtn').onclick = () => pageFlip.flipNext();
    }

    initFlipbook().catch(err => {
      document.getElementById('status').textContent = 'Error loading PDF: ' + err.message;
    });
  </script>
</body>
</html>
