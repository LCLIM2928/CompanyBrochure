<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImpactSoft Company Brochure</title>
  <style>
    body {
      margin: 0;
      padding-top: 106px;
      padding-left: 195px;
      background: #1e1e24;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 106px);
      overflow-x: auto;
    }

    /* Top Stacked Bar: Follow/Contact Button on Top, Flip Brochure Button Directly Beneath */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      background: rgba(30, 30, 36, 0.88);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10001;
    }
    .follow-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff1e56, #ff4d8d);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      padding: 7px 22px;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(255, 30, 86, 0.85);
      animation: pinkBlink 1.1s ease-in-out infinite;
    }
    .follow-btn:hover {
      animation: none;
      transform: scale(1.05);
      box-shadow: 0 0 26px rgba(255, 77, 141, 1);
    }
    @keyframes pinkBlink {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 30, 86, 0.95);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.96);
        box-shadow: 0 0 6px rgba(255, 77, 141, 0.3);
      }
    }

    /* Flip Brochure Button with Animated Book + Hand Icon */
    .flip-hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.3px;
      padding: 6px 20px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .flip-hero-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #fbbf24, #f97316);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.8);
    }
    .book-hand-icon {
      display: inline-flex;
      align-items: center;
      font-size: 18px;
      line-height: 1;
      animation: handFlipMotion 1.4s ease-in-out infinite;
    }
    @keyframes handFlipMotion {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(-4px) rotate(-12deg); }
    }

    /* Left-Hand Vertical Action Panel */
    .left-panel {
      position: fixed;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 170px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 12px 10px;
      background: rgba(24, 24, 30, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 10002;
    }

    .side-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }
    .side-btn:hover {
      transform: translateX(4px) scale(1.02);
    }

    /* 1. Online Shop with Animated Red Cart Track */
    .shop-btn {
      background: linear-gradient(135deg, #dc2626, #f97316);
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.45);
      padding-left: 9px;
    }
    .cart-track {
      display: inline-flex;
      align-items: center;
      width: 34px;
      height: 24px;
      background: #ffffff;
      border-radius: 999px;
      padding: 2px 4px;
      overflow: hidden;
      position: relative;
      border-bottom: 2px dashed #94a3b8;
      flex-shrink: 0;
    }
    .cart-track img,
    .cart-track svg {
      height: 20px;
      width: auto;
      display: block;
      animation: cartRoll 1.8s ease-in-out infinite;
    }
    @keyframes cartRoll {
      0%   { transform: translateX(-6px) rotate(0deg); }
      45%  { transform: translateX(8px) rotate(-4deg); }
      75%  { transform: translateX(10px) rotate(0deg); }
      100% { transform: translateX(-6px) rotate(0deg); }
    }

    /* 2. Website Button */
    .web-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* 3. TikTok Button */
    .tiktok-btn {
      background: #0f0f13;
      border: 1px solid #25f4ee;
      box-shadow: -2px 0 8px rgba(37, 244, 238, 0.45), 2px 0 8px rgba(254, 44, 85, 0.45);
    }

    /* 4. Facebook Button */
    .fb-btn {
      background: #1877f2;
      box-shadow: 0 4px 12px rgba(24, 119, 242, 0.35);
    }

    /* 5. WhatsApp Me Blinking Button */
    .wa-btn {
      background: linear-gradient(135deg, #16a34a, #25d366);
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.85);
      animation: waBlink 1.15s ease-in-out infinite;
    }
    @keyframes waBlink {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 18px rgba(37, 211, 102, 0.95);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.96);
        box-shadow: 0 0 6px rgba(37, 211, 102, 0.3);
      }
    }

    /* 6. Blinking Contact LCLIM(Eden) 012-3706968 Text */
    .contact-blink-text {
      text-align: center;
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.4;
      color: #fde047;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.95);
      padding: 6px 4px 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      animation: contactTextBlink 1s ease-in-out infinite;
    }
    @keyframes contactTextBlink {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.2;
        transform: scale(0.97);
      }
    }

    .book-wrapper {
      position: relative;
      width: calc(96vw - 195px);
      max-width: 1400px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto;
      transition: transform 0.25s ease;
      transform-origin: top center;
    }
    #flipbook {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      z-index: 1;
    }
    .page {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Blinking welcome overlay on the left half of the cover spread */
    #coverWelcome {
      position: absolute;
      left: 0;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 9999;
    }
    #coverWelcome span {
      font-size: clamp(24px, 2.6vw, 42px);
      font-weight: 800;
      line-height: 1.35;
      color: #60a5fa;
      text-shadow: 0 0 22px rgba(96, 165, 250, 0.9);
      animation: blinkPulse 1.2s ease-in-out infinite;
    }
    @keyframes blinkPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.15; transform: scale(0.97); }
    }

    /* Mobile responsive adjustments */
    @media (max-width: 767px) {
      body {
        padding-left: 0;
        padding-bottom: 145px;
      }
      .book-wrapper {
        width: 96vw;
      }
      #coverWelcome {
        display: none !important;
      }
      .left-panel {
        left: 50%;
        top: auto;
        bottom: 62px;
        transform: translateX(-50%);
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        width: 94vw;
        padding: 8px;
        gap: 6px;
      }
      .side-btn {
        font-size: 12px;
        padding: 7px 10px;
      }
      .contact-blink-text {
        width: 100%;
        border-top: none;
        padding-top: 2px;
      }
    }

    .controls {
      position: sticky;
      bottom: 12px;
      background: rgba(30, 30, 36, 0.9);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      z-index: 10000;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.music-on { background: #10b981; }
    button.music-on:hover { background: #059669; }
    #status { font-size: 15px; color: #cbd5e1; margin-top: 20px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>

  <!-- Top Stacked Buttons: Follow/Contact on Top, Flip Brochure Directly Beneath -->
  <div class="top-bar">
    <a class="follow-btn" href="https://lclim2928.github.io/2025nameCard/ImpactSoft_Follow_me.html" target="_blank" rel="noopener noreferrer">
      Follow/contact Me
    </a>
    <button id="topFlipBtn" class="flip-hero-btn" type="button">
      <span class="book-hand-icon">📖👆</span>
      <span>Flip the Brochure</span>
    </button>
  </div>

  <!-- Left-Hand Vertical Panel -->
  <div class="left-panel">
    <!-- Online Shop with Animated Red Cart Track -->
    <a class="side-btn shop-btn" href="https://take.app/impactsoft" target="_blank" rel="noopener noreferrer">
      <span class="cart-track">
        <img src="cartimages.jpeg" alt="Cart" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <svg style="display:none;" viewBox="0 0 64 56" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8h10l6 28h30l6-20H18" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <polygon points="18,16 56,16 50,36 20,36" fill="#dc2626"/>
          <circle cx="24" cy="46" r="5" fill="#1e293b"/>
          <circle cx="46" cy="46" r="5" fill="#1e293b"/>
        </svg>
      </span>
      <span>Online Shop</span>
    </a>

    <!-- Website -->
    <a class="side-btn web-btn" href="https://impactsoftsolutions.com/" target="_blank" rel="noopener noreferrer">
      🌐 Website
    </a>

    <!-- TikTok -->
    <a class="side-btn tiktok-btn" href="https://www.tiktok.com/@impactsoft" target="_blank" rel="noopener noreferrer">
      🎵 TikTok
    </a>

    <!-- Facebook -->
    <a class="side-btn fb-btn" href="https://www.facebook.com/lclim.ImpactSoft" target="_blank" rel="noopener noreferrer">
      📘 Facebook
    </a>

    <!-- WhatsApp Me (Blinking) -->
    <a class="side-btn wa-btn" href="https://wa.me/60123706968" target="_blank" rel="noopener noreferrer">
      💬 WhatsApp Me
    </a>

    <!-- Blinking Contact Text -->
    <div class="contact-blink-text">
      Contact LCLIM(Eden) 012-3706968
    </div>
  </div>

  <!-- Background Audio Element with autoplay enabled -->
  <audio id="bgMusic" src="music.mp3" autoplay loop preload="auto"></audio>

  <div id="status">Loading high-resolution brochure...</div>

  <div class="book-wrapper" id="bookWrapper">
    <div id="coverWelcome">
      <span>Welcome to ImpactSoft company brochure, click the right side page to flip the brochure 👉</span>
    </div>
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">← Previous</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn">Next →</button>
    <button id="zoomOutBtn" class="secondary">− Zoom</button>
    <button id="zoomResetBtn" class="secondary">100%</button>
    <button id="zoomInBtn" class="secondary">+ Zoom</button>
    <button id="musicBtn" class="music-on">⏸ Stop Music</button>
  </div>

  <script>
    const pdfUrl = 'brochure.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // --- Autoplay Music + User Stop/Resume Control ---
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    bgMusic.volume = 0.4;
    let userStoppedMusic = false;

    function syncMusicButton() {
      if (!bgMusic.paused) {
        musicBtn.textContent = '⏸ Stop Music';
        musicBtn.classList.remove('secondary');
        musicBtn.classList.add('music-on');
      } else {
        musicBtn.textContent = '🎵 Play Music';
        musicBtn.classList.remove('music-on');
        musicBtn.classList.add('secondary');
      }
    }

    function attemptAutoplay() {
      if (userStoppedMusic) return;
      bgMusic.play().then(() => {
        syncMusicButton();
      }).catch(() => {
        syncMusicButton();
      });
    }

    window.addEventListener('DOMContentLoaded', attemptAutoplay);
    window.addEventListener('load', attemptAutoplay);

    ['pointerdown', 'click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, () => {
        if (bgMusic.paused && !userStoppedMusic) {
          attemptAutoplay();
        }
      }, { once: true });
    });

    musicBtn.onclick = (e) => {
      e.stopPropagation();
      if (!bgMusic.paused) {
        userStoppedMusic = true;
        bgMusic.pause();
        syncMusicButton();
      } else {
        userStoppedMusic = false;
        bgMusic.play().then(syncMusicButton).catch(err => {
          alert('Unable to play music.mp3: ' + err.message);
        });
      }
    };

    // --- Zoom Controls ---
    let currentZoom = 1;
    const bookWrapper = document.getElementById('bookWrapper');

    function applyZoom() {
      bookWrapper.style.transform = `scale(${currentZoom})`;
      document.getElementById('zoomResetBtn').textContent = `${Math.round(currentZoom * 100)}%`;
    }

    document.getElementById('zoomInBtn').onclick = () => {
      currentZoom = Math.min(1.8, currentZoom + 0.2);
      applyZoom();
    };
    document.getElementById('zoomOutBtn').onclick = () => {
      currentZoom = Math.max(0.8, currentZoom - 0.2);
      applyZoom();
    };
    document.getElementById('zoomResetBtn').onclick = () => {
      currentZoom = 1;
      applyZoom();
    };

    // --- Flipbook Initialization ---
    async function initFlipbook() {
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      const container = document.getElementById('flipbook');
      const welcomeOverlay = document.getElementById('coverWelcome');
      let pageWidth = 650;
      let pageHeight = 850;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 3.0 });

        if (i === 1) {
          const ratio = viewport.height / viewport.width;
          const availW = window.innerWidth >= 768 ? (window.innerWidth - 215) * 0.48 : window.innerWidth * 0.90;
          const maxAvailHeight = window.innerHeight * 0.76;
          pageWidth = Math.min(700, Math.round(availW), Math.round(maxAvailHeight / ratio));
          pageHeight = Math.round(pageWidth * ratio);
        }

        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        pageDiv.appendChild(canvas);
        container.appendChild(pageDiv);
      }

      document.getElementById('status').style.display = 'none';

      const pageFlip = new St.PageFlip(container, {
        width: pageWidth,
        height: pageHeight,
        size: 'stretch',
        minWidth: 320,
        maxWidth: 850,
        minHeight: 420,
        maxHeight: 1150,
        showCover: true,
        usePortrait: window.innerWidth < 768
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      const updateUI = () => {
        const currentIndex = pageFlip.getCurrentPageIndex();
        document.getElementById('pageInfo').textContent =
          `Page ${currentIndex + 1} of ${pdf.numPages}`;

        welcomeOverlay.style.display = (currentIndex === 0) ? 'flex' : 'none';
      };

      updateUI();
      pageFlip.on('flip', () => {
        updateUI();
        attemptAutoplay();
      });

      document.getElementById('prevBtn').onclick = () => pageFlip.flipPrev();
      document.getElementById('nextBtn').onclick = () => pageFlip.flipNext();

      // Top "Flip the Brochure" button flips forward, or loops back to cover on the last page
      document.getElementById('topFlipBtn').onclick = () => {
        if (pageFlip.getCurrentPageIndex() >= pdf.numPages - 1) {
          pageFlip.turnToPage(0);
        } else {
          pageFlip.flipNext();
        }
        attemptAutoplay();
      };
    }

    initFlipbook().catch(err => {
      document.getElementById('status').textContent = 'Error loading PDF: ' + err.message;
    });
  </script>
</body>
</html>
